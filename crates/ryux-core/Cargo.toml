[package]
name = "ryux-core"
description = "RYUX deterministic checks (canvas audit, design drift, source scan, rendered page checks, and JSX syntax checks), with no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
regex = "1"
fancy-regex = "0.14"
serde_json = { version = "1", features = ["preserve_order"] }
# JSX and TSX as a syntax tree (src/jsx.rs). Pinned exactly: oxc changes its AST between minor versions.
oxc_allocator = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_span = "=0.159.0"
# HTML as a tree (src/markup.rs): html5ever's tokenizer and tree builder, into scraper's tree. Pinned exactly:
# markup.rs implements html5ever's TreeSink, which changes between minor versions, and scraper must match it.
html5ever = "=0.40.1"
scraper = { version = "=0.29.0", default-features = false }
